name: Documentation

on:
  push:
    branches:
      - master
    tags: '*'
  pull_request:

# The reusable documentation workflow requests these permissions for its
# build job; declare them here so the call starts even when the repo's
# default GITHUB_TOKEN permissions are read-only.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build-and-deploy-docs:
    name: "Documentation"
    uses: "SciML/.github/.github/workflows/documentation.yml@v1"
    secrets: "inherit"
    with:
      # This package's docs build is dominated by cold-depot precompilation and
      # by executing the example blocks; a no-cache, coverage-instrumented run
      # exceeded GitHub's 6-hour job limit.
      cache: true
      coverage: false
      # `chaotic_ode.md` diverges to Infs/NaNs under Julia 1.13 (`matrix
      # contains Infs or NaNs` from the shadowing adjoint), which does not
      # reproduce on 1.12. Pin the docs build to the version the examples are
      # verified on; the 1.13 divergence is a separate issue.
      julia-version: "1.12"
